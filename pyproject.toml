[project]
name = "sticky-net"
version = "0.1.0"
description = "AI Agentic Honey-Pot for Scam Detection"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "google-genai>=1.51.0",
    "google-cloud-firestore>=2.14.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "requests>=2.31.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "config", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    # `class X(str, Enum)` and StrEnum format differently; the API depends on the former.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Prompt templates are LLM input; rewrapping their lines would change the prompt text.
"src/agents/prompts.py" = ["E501"]
"src/detection/classifier.py" = ["E501"]
# Test fixtures hold long scam messages verbatim.
"tests/**" = ["E501"]
"final-testing/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "final-testing"]
markers = [
    "integration: needs a live server on localhost:8000 backed by real Gemini credentials",
]
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "config"]

[tool.coverage.run]
source = ["src", "config"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
