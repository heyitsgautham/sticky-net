name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python 3.11

      - name: Ruff lint
        run: uv run --frozen ruff check src config tests final-testing conftest.py

      - name: Ruff format check
        run: uv run --frozen ruff format --check src config tests final-testing conftest.py

      - name: Mypy (strict)
        run: uv run --frozen mypy

      - name: Pytest with coverage
        run: uv run --frozen pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"

      - name: requirements.txt matches uv.lock
        run: |
          uv export --frozen --no-hashes --no-emit-project --extra dev -o /tmp/requirements.txt -q
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)

      - name: pip-audit
        run: uvx --from "pip-audit==2.10.1" pip-audit -r requirements.txt --no-deps --disable-pip

  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Lint
        run: yarn lint

      # Fails below the coverage thresholds in frontend/package.json.
      - name: Test
        env:
          CI: "true"
        run: yarn test:coverage

      - name: Build
        env:
          CI: "true"
          REACT_APP_API_URL: http://localhost:8080
        run: yarn build

      # yarn audit's exit code is a bitmask of every severity it found, even with --level,
      # so read the summary and fail only on critical advisories.
      - name: yarn audit (critical)
        run: |
          yarn audit --groups dependencies --json > audit.jsonl || true
          node -e '
            const lines = require("fs").readFileSync("audit.jsonl", "utf8").trim().split("\n");
            const summary = lines.map(JSON.parse).find((l) => l.type === "auditSummary");
            const v = summary.data.vulnerabilities;
            console.log("yarn audit:", JSON.stringify(v));
            if (v.critical > 0) process.exit(1);
          '

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz gitleaks
          ./gitleaks git . --redact --no-banner

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t sticky-net:ci .

      - name: Validate compose file
        run: docker compose config --quiet
